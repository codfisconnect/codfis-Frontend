<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Forgot Password</title>
 <link rel="icon" href="/images/codfis-Tittle-logo .png">
  <link rel="stylesheet" href="studentForgotPassword.css" />
</head>
<body>
  <div class="forgot-container">
    <form class="forgot-form" onsubmit="return false;">
      <h1>Student Forgot Password</h1>

      <input type="email" id="studentForgotEmail" placeholder="Enter your email" required />
      <button type="button" onclick="sendStudentOtp()">Send OTP</button>

      <input type="text" id="studentOtp" placeholder="Enter OTP" />
      <input type="password" id="studentNewPassword" placeholder="Enter new password" />

      <button type="button" onclick="resetStudentPassword()">Reset Password</button>
      <p id="studentForgotMsg"></p>

      <a href="studentLogin.html">Back to Login</a>
    </form>
  </div>

  <script src="studentForgotPassword.js"></script>
</body>
</html>
