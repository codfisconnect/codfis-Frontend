<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Course List</title>
  <link rel="icon" href="images/codfis-Tittle-logo.png">
  <link rel="stylesheet" href="admin.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
<script>
  const token = localStorage.getItem("token");
  if (!token) {
    window.location.href = "AdminLogin.html";
  }
</script>
</head>
<body>
  <div class="dashboard">

    <aside class="sidebar">
      <h2 class="sidebar-logo">CODFIS</h2>
      <a href="admin.html"><i class="fa fa-home"></i> Dashboard</a>
      <a href="course.html" class="active"><i class="fa fa-book"></i> Courses</a>
      <a href="students.html"><i class="fa fa-users"></i> Students</a>
      <a href="newTrainers.html"><i class="fa fa-user-tie"></i> Trainers</a>
      <a href="" onclick="logout()"><i class="fa fa-sign-out"></i> Logout</a>
    </aside>

    <main class="main">
      <div class="header">
        <h1>Course Management</h1>
      </div>

      <section class="form-panel">
        <h2>Add New Course</h2>

        <form id="courseForm" class="course-form">
          <input type="text" id="courseId" name="courseID" placeholder="course ID" required />
          <input type="text" id="courseName" name="courseName" placeholder="course name" required />
          <input type="text" id="courseDuration" name="courseDuration" placeholder="course duration" required />
          <input type="text" id="trainerName" name="trainerName" placeholder="trainer name" required />
          <button type="submit" class="primary-btn">Save Course</button>
          <button type="button" id="updateBtn" class="secondary-btn">Update Course</button>
        </form>
      </section>

      <section class="table-container">
        <h2 id="coursesCountDis"></h2>
        <table class="data-table">
          <thead>
            <tr>
              <th>Course ID</th>
              <th>Course Name</th>
              <th>Course Duration</th>
              <th>Trainer Name</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="cors-bdy"></tbody>
        </table>
      </section>
      <div id="courseContainer"></div>
    </main>

  </div>

  <script src="course.js"></script>
  <script>
    window.onload = function () {
      showcourses();
    };
  </script>
  <script src="AdminLogin.js"></script>
  <script>
    window.history.pushState(null, null, window.location.href);

   window.onpopstate = function () {
    window.location.replace("admin.html");
    };
  </script>
</body>
</html>
