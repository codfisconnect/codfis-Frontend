<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Login</title>
  <link rel="icon" data-media="branding.favicon" href="">
  <link rel="stylesheet" href="studentLogin.css" />
</head>
<body>
  <div class="login-container">
    <form class="login-form" onsubmit="studentLogin(); return false;">
      <h1>Student Login</h1>

      <input type="email" id="studentEmail" placeholder="Email" required />
      <input type="password" id="studentPassword" placeholder="Password" required />

      <button type="submit" id="studentLoginBtn">Login</button>
      <p id="studentLoginMsg"></p>
      <a href="studentRegister.html" class="register-link">Don't have an account? Register</a>
      <a href="studentForgotPassword.html" class="studentForgot-link">Forgot Password?</a>
    </form>
  </div>

  <script src="studentLogin.js"></script>
  <script src="src/config/media.js"></script>
  <script src="media-init.js"></script>
</body>
</html>
