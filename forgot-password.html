<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password</title>
  <link rel="stylesheet" href="auth.css" />
</head>
<body>
  <div class="auth-container">
    <form id="forgotPasswordForm" class="auth-form">
      <h1>Forgot Password</h1>

<input type="email" id="email" placeholder="Enter your email" name="email" />
<button type="button" onclick="sendOtp()" id="sendOtpBtn">Send OTP</button>

<input type="text" id="otp" placeholder="Enter OTP" name="otp" />
<input type="password" id="newPassword" placeholder="Enter new password" name="newPassword" />
<button type="button" onclick="resetPassword()" id="resetPasswordBtn">Reset Password</button>

<p id="msg"></p>
      <p><a href="AdminLogin.html">Back to Login</a></p>
    </form>
  </div>

  <script src="forgot-password.js"></script>
  <script>
    window.history.pushState(null, null, window.location.href);

   window.onpopstate = function () {
    window.location.replace("AdminLogin.html");
    };
  </script>
</body>
</html>
