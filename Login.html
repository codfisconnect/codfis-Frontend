<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login</title>
  <link rel="stylesheet" href="login.css" />
</head>
<body>
  <div class="login-container">
    <form id="loginForm" class="login-form" onsubmit="login(); return false;">
      <h1 id="log-hed">ADMIN LOGIN</h1>

      <input type="text" id="uname" placeholder="User ID" required />
      <input type="password" id="pass" placeholder="Password" required />

      <button type="submit" id="log-btn">Login</button>
      <a href="forgot-password.html">forget password?</a>
      <a href="create.html">Create Account</a>
      <p id="errorMsg"></p>
    </form>
  </div>

  <script src="login.js"></script>
  <script>
    window.history.pushState(null, null, window.location.href);

   window.onpopstate = function () {
    window.location.replace("index.html");
    };
  </script>
</body>
</html>
